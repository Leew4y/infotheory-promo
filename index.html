<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>信息论 · 不确定的度量</title>
<style>
  :root { --paper: #F3F1EA; --ink: #1A1917; --rust: #C9663D; --grey: #8F8A80; }
  html, body { margin: 0; height: 100%; background: #0d0b09; color: var(--ink); overflow: hidden; }
  body { font-family: "Noto Serif SC", "华文中宋", "SimSun", serif; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; background: var(--paper); display: block; }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: var(--paper); cursor: pointer; z-index: 5; text-align: center; padding: 16px; }
  #start h1 { font-weight: 500; font-size: clamp(40px, 8vw, 110px); margin: 0; letter-spacing: .18em; color: var(--ink); }
  #start p { margin: 0; font-family: Georgia, serif; letter-spacing: .32em; color: var(--grey); font-size: clamp(11px, 1.5vw, 16px); }
  #start button { margin-top: 26px; font: 500 16px "Noto Serif SC", serif; color: var(--paper); background: var(--ink); border: 0; border-radius: 999px;
    padding: 12px 30px; cursor: pointer; letter-spacing: .2em; }
  #start small { color: var(--grey); font-size: 12px; letter-spacing: .12em; }
  #ui { position: fixed; left: 0; right: 0; bottom: 0; padding: 14px 16px 16px; display: flex; gap: 14px; align-items: center;
    background: linear-gradient(transparent, rgba(20,18,14,.7)); transition: opacity .4s; z-index: 4; font: 13px Georgia, serif; color: #e8e2d4; }
  #ui.hide { opacity: 0; }
  #ui button { background: none; border: 0; color: #fff; font-size: 18px; cursor: pointer; width: 32px; }
  #bar { flex: 1; height: 4px; background: rgba(255,255,255,.25); border-radius: 3px; cursor: pointer; position: relative; }
  #fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--rust); border-radius: 3px; width: 0; }
  #info { font-family: Consolas, monospace; font-size: 12px; color: #cfc8b8; min-width: 260px; }
  body.export #start, body.export #ui { display: none; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
<div id="start">
  <h1>信息论</h1>
  <p>THE MEASURE OF UNCERTAINTY</p>
  <button id="go">播放</button>
  <small id="load">载入字体中…</small>
</div>
<div id="ui" class="hide"><button id="pp">❚❚</button><span id="tm">0:00</span><div id="bar"><div id="fill"></div></div><span id="dur">0:00</span><span id="info"></span><button id="fs">⛶</button></div>
<audio id="au" preload="auto"></audio>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
